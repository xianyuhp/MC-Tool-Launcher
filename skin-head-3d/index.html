<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D 头部头像 · @daidr/minecraft-skin-renderer</title>
  <script type="importmap">
    {
      "imports": {
        "@daidr/minecraft-skin-renderer": "https://cdn.jsdelivr.net/npm/@daidr/minecraft-skin-renderer@0.3.2/+esm",
        "@daidr/minecraft-skin-renderer/webgl": "https://cdn.jsdelivr.net/npm/@daidr/minecraft-skin-renderer@0.3.2/webgl/+esm"
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 20% 0%, #23304a, #0d1119 60%);
      font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif; color: #e8edf6;
    }
    .card { width: 420px; padding: 22px; border-radius: 18px; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(14px); }
    h1 { margin: 0 0 16px; font-size: 16px; font-weight: 600; letter-spacing: .04em; }
    .row { display: flex; gap: 8px; align-items: center; }
    input { flex: 1; height: 36px; padding: 0 12px; border-radius: 10px; color: inherit;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); outline: none; }
    input:focus { border-color: #5b9dff; }
    button { height: 36px; padding: 0 16px; border-radius: 10px; border: 0; cursor: pointer;
      color: #fff; background: #3b82f6; font: inherit; }
    button:disabled { opacity: .45; cursor: default; }
    .stage { margin: 18px auto 14px; width: 256px; height: 256px; border-radius: 16px;
      background-color: #ffffff08;
      background-image: linear-gradient(45deg,#ffffff10 25%,transparent 25%,transparent 75%,#ffffff10 75%),
                        linear-gradient(45deg,#ffffff10 25%,transparent 25%,transparent 75%,#ffffff10 75%);
      background-size: 16px 16px; background-position: 0 0, 8px 8px;
      display: grid; place-items: center; overflow: hidden; }
    canvas { width: 256px; height: 256px; image-rendering: pixelated; }
    #status { font-size: 12px; color: #9fb0c8; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Minecraft 3D 头部头像</h1>
    <div class="row">
      <input id="who" value="Notch" placeholder="玩家名或 32 位 UUID" />
      <button id="go">渲染</button>
    </div>
    <div class="row" style="margin-top:10px;font-size:12px;color:#9fb0c8">
      <span>皮肤形态</span>
      <label><input type="radio" name="model" value="auto" checked /> 自动</label>
      <label><input type="radio" name="model" value="classic" /> 经典</label>
      <label><input type="radio" name="model" value="slim" /> 纤细</label>
    </div>
    <div class="stage"><canvas id="out" width="256" height="256"></canvas></div>
    <div class="row">
      <button id="save" disabled>下载 PNG</button>
      <span id="status">等待渲染…</span>
    </div>
  </div>

  <script type="module">
    import { renderHeadFromPlayer } from "./head-avatar.js";

    const input = document.getElementById("who");
    const go = document.getElementById("go");
    const save = document.getElementById("save");
    const status = document.getElementById("status");
    const canvas = document.getElementById("out");

    let lastUrl = null;

    async function run() {
      go.disabled = save.disabled = true;
      status.textContent = "解析账号 → 拉取皮肤 → 渲染中…";
      try {
        const model = document.querySelector('input[name="model"]:checked').value;
        const result = await renderHeadFromPlayer(canvas, input.value, 256, model);
        lastUrl = result.dataUrl;
        save.disabled = false;
        status.textContent = `${result.profile.name} · ${result.profile.slim ? "纤细 Slim" : "经典 Classic"} · ${result.width}×${result.height}`;
        window.__headResult = { ok: true, ...result, dataUrl: undefined };
      } catch (error) {
        status.textContent = "失败：" + error.message;
        window.__headResult = { ok: false, error: error.message };
      } finally {
        go.disabled = false;
      }
    }

    go.addEventListener("click", run);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
    document.querySelectorAll('input[name="model"]').forEach((radio) =>
      radio.addEventListener("change", run)
    );
    save.addEventListener("click", () => {
      if (!lastUrl) return;
      const a = document.createElement("a");
      a.href = lastUrl;
      a.download = `${input.value.trim() || "head"}-3d-head.png`;
      a.click();
    });

    run();
  </script>
</body>
</html>

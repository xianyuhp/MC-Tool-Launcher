<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D 皮肤查看器 · 行走动画</title>
  <script type="importmap">
    {
      "imports": {
        "@daidr/minecraft-skin-renderer": "https://cdn.jsdelivr.net/npm/@daidr/minecraft-skin-renderer@0.3.2/+esm",
        "@daidr/minecraft-skin-renderer/webgl": "https://cdn.jsdelivr.net/npm/@daidr/minecraft-skin-renderer@0.3.2/webgl/+esm"
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; gap: 16px; padding: 16px;
      background: radial-gradient(1200px 700px at 15% 0%, #24304a, #0d1119 62%);
      color: #e8edf6; font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    /* 左侧：3D 查看器 */
    .viewer {
      flex: 1 1 auto; min-width: 320px; position: relative; overflow: hidden;
      border-radius: 18px; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.045);
    }
    .viewer canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    .viewer canvas:active { cursor: grabbing; }
    .hint {
      position: absolute; left: 14px; bottom: 12px; font-size: 11px; color: #8fa1ba;
      pointer-events: none; user-select: none;
    }
    /* 右侧：控制面板 */
    .panel { width: 300px; flex: 0 0 300px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      padding: 16px; border-radius: 16px; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    label { display: block; font-size: 11px; color: #9fb0c8; margin: 12px 0 6px; }
    input[type="text"] {
      width: 100%; height: 34px; padding: 0 10px; border-radius: 9px; color: inherit;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
      outline: none; font: inherit; font-size: 12.5px;
    }
    input[type="text"]:focus { border-color: #5b9dff; }
    button {
      height: 34px; padding: 0 14px; border-radius: 9px; border: 0; cursor: pointer;
      background: #3b82f6; color: #fff; font: inherit; font-size: 12.5px;
    }
    button.ghost { background: rgba(255,255,255,.1); }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row button { flex: 1; }
    input[type="range"] { width: 100%; accent-color: #3b82f6; }
    .seg { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #cfd9e8; }
    .seg label { display: inline-flex; align-items: center; gap: 4px; margin: 0; color: inherit; font-size: 12px; }
    .value { float: right; color: #9fb0c8; font-variant-numeric: tabular-nums; }
    #status { font-size: 12px; color: #9fb0c8; min-height: 18px; margin-top: 10px; }
    @media (max-width: 860px) {
      body { flex-direction: column; }
      .panel { width: auto; flex: 0 0 auto; }
      .viewer { min-height: 380px; }
    }
  </style>
</head>
<body>
  <div class="viewer" id="viewer">
    <canvas id="canvas"></canvas>
    <div class="hint">拖拽旋转 · 滚轮缩放</div>
  </div>

  <div class="panel">
    <div class="card">
      <h1>3D 皮肤查看器</h1>
      <label>玩家名 / UUID</label>
      <input id="who" type="text" value="Notch" placeholder="例如 Notch" />
      <div class="row">
        <button id="apply">切换皮肤</button>
        <button id="reset" class="ghost">重置视角</button>
      </div>

      <label>行走速度 <span class="value" id="speedValue">1.0×</span></label>
      <input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1" />

      <label>皮肤形态</label>
      <div class="seg">
        <label><input type="radio" name="model" value="auto" checked />自动</label>
        <label><input type="radio" name="model" value="classic" />经典 (Classic)</label>
        <label><input type="radio" name="model" value="slim" />纤细 (Slim)</label>
      </div>

      <div id="status">加载中…</div>
    </div>

    <div class="card" style="font-size:12px;color:#9fb0c8;">
      行走动画：<code>viewer.playAnimation("walk", { speed })</code><br />
      切换皮肤：<code>viewer.setSkin(url)</code><br />
      拖拽 / 缩放：创建时 <code>enableRotate: true</code>、<code>enableZoom: true</code>
    </div>
  </div>

  <script type="module">
    import { createWalkingViewer, switchSkin, bindResponsive } from "./skin-viewer.js";
    import { resolveSkin } from "./head-avatar.js";

    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");

    let viewer = null;
    let detectedSlim = false;
    let currentName = "";

    const modelOf = () => document.querySelector('input[name="model"]:checked').value;
    const effectiveSlim = () =>
      modelOf() === "slim" ? true : modelOf() === "classic" ? false : detectedSlim;
    const modelLabel = (slim) => (slim ? "纤细 Slim" : "经典 Classic");

    function applyModel() {
      if (!viewer) return;
      viewer.setSlim(effectiveSlim());
      status.textContent = `${currentName} · 行走中 · ${modelLabel(effectiveSlim())}`;
    }

    // 先用玩家名解析出皮肤，再创建 viewer
    async function create(name) {
      status.textContent = "解析账号 → 拉取皮肤 → 渲染中…";
      try {
        const profile = await resolveSkin(name);
        detectedSlim = profile.slim;
        currentName = profile.name;
        if (viewer) { viewer.dispose(); viewer = null; }
        viewer = await createWalkingViewer(canvas, {
          skin: profile.skinUrl,
          uuid: profile.uuid,
          slim: effectiveSlim(),
          walkSpeed: Number(speed.value),
        });
        bindResponsive(viewer, canvas);
        applyModel();
      } catch (error) {
        status.textContent = "失败：" + error.message;
      }
    }

    document.getElementById("apply").addEventListener("click", async () => {
      const input = document.getElementById("who").value.trim();
      if (!input) return;
      if (!viewer) return create(input);
      try {
        const profile = await switchSkin(viewer, input);
        detectedSlim = profile.slim;
        currentName = profile.name;
        applyModel();
        document.getElementById("who").value = profile.name;
      } catch (error) {
        status.textContent = "切换失败：" + error.message;
      }
    });

    document.querySelectorAll('input[name="model"]').forEach((radio) =>
      radio.addEventListener("change", applyModel)
    );

    document.getElementById("reset").addEventListener("click", () => {
      if (!viewer) return;
      viewer.resetCamera();
      viewer.setZoom(62);
    });

    speed.addEventListener("input", () => {
      const value = Number(speed.value);
      speedValue.textContent = value.toFixed(1) + "×";
      viewer?.setAnimationSpeed(value);
    });

    create(document.getElementById("who").value);
  </script>
</body>
</html>
